name: Code Quality Checks

# Run on pull requests and push to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality and Pre-commit Hooks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run pytest
        run: uv run pytest -v

  security:
    runs-on: ubuntu-latest
    name: Security Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: No individual-level survey data tracked in git
        # Content-based check across all of data/**: rejects any tracked
        # CSV/TSV/JSON whose columns include a free-text response field or
        # its _ja translation. Allows the aggregated data/public/ extract.
        run: python scripts/check_sensitive_data.py

      - name: No raw exports checked out in CI
        run: |
          if git ls-files -- 'data/downloaded/*.csv' 'data/downloaded/*.xlsx' \
               'data/raw_data/*.csv' 'data/raw_data/*.xlsx' | grep -q .; then
            echo "❌ ERROR: a raw export is tracked under data/downloaded/ or data/raw_data/"
            exit 1
          fi
          echo "✅ No raw export files tracked in git"
