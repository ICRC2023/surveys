name: Update changelog

on:
  # Every Tuesday 00:07 UTC
  schedule:
    - cron: "7 0 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for cz changelog
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install commitizen
        run: pipx install commitizen
      - name: Regenerate the changelog
        run: cz changelog --incremental
      - name: Open a PR if the changelog changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-changelog
          delete-branch: true
          commit-message: "chore: update changelog"
          title: "chore: update changelog"
          body: >-
            Regenerated by `cz changelog --incremental`. Merging goes
            through the normal CI checks.
          labels: chore
