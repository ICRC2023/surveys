# Deploy the documentation to GitHub Pages (https://www.icrc2023.org/surveys/).
#
# Runs only after CI succeeds on main (or on manual dispatch). Two sites are
# built independently and deployed together (Pages allows a single artifact):
#   /            -> the ICRC2023 survey-results reports (Quarto, reports/)
#   /titanite/   -> the titanite framework docs (Zensical, zensical.toml)
name: Deploy docs to Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-reports:
    name: Build survey reports (Quarto)
    # Skip when the triggering CI run failed (manual dispatch has no run to check).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      # reports render from reports/_freeze/, so no notebook re-execution and
      # no data/private/ needed.
      - name: Render
        working-directory: reports
        run: uv run quarto render
      - name: Upload reports site
        uses: actions/upload-artifact@v7
        with:
          name: reports-site
          path: reports/_site/

  build-titanite:
    name: Build titanite docs (Zensical)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Build
        run: uv run zensical build --clean
      - name: Upload titanite site
        uses: actions/upload-artifact@v7
        with:
          name: titanite-site
          path: site/

  deploy:
    name: Merge and deploy to Pages
    needs: [build-reports, build-titanite]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download reports site
        uses: actions/download-artifact@v8
        with:
          name: reports-site
          path: _site
      - name: Download titanite site
        uses: actions/download-artifact@v8
        with:
          name: titanite-site
          path: _site/titanite
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
