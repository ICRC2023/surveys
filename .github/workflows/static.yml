# Deploy the documentation to GitHub Pages (https://www.icrc2023.org/surveys/).
#
# Two sites share the deployment:
#   /            -> the ICRC2023 survey-results reports (Quarto, reports/)
#   /titanite/   -> the titanite framework docs (Zensical, zensical.toml)
name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      # reports render from reports/_freeze/, so no notebook re-execution and
      # no data/private/ needed.
      - name: Render survey reports (Quarto)
        working-directory: reports
        run: uv run quarto render
      - name: Build titanite docs (Zensical) and place them under /titanite/
        run: |
          uv run zensical build --clean
          mkdir -p reports/_site/titanite
          cp -r site/. reports/_site/titanite/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./reports/_site/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
