name: Check docs build on branches

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Build titanite docs (Zensical)
        run: uv run zensical build --clean
      - name: Render survey reports (Quarto)
        working-directory: reports
        run: uv run quarto render
