repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

  - repo: local
    hooks:
      - id: check-sensitive-data
        name: no individual-level survey data
        description: >-
          Reject staged CSV/TSV/JSON under data/ whose columns include a
          free-text response field or its _ja translation.
        entry: python scripts/check_sensitive_data.py
        language: system
        files: ^data/.*\.(csv|tsv|json)$

ci:
  autofix_commit_msg: 'chore: pre-commit auto-fixes'
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore: pre-commit auto-update'
