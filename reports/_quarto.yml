project:
  type: website
  output-dir: _site

# freeze: pages are executed locally (`task reports:render`) and their output
# is cached under reports/_freeze/, which is committed. CI only renders the
# cached output, so the render environment never needs data/public/ (let
# alone data/private/). Re-run `task reports:render` after changing a page or
# regenerating data/public/. See PLAN.md Phase 5 and Phase 7.
execute:
  freeze: true

# Pages import reports/_helpers.py at render time (via sys.path); it is not
# a site resource. CI renders from _freeze/ and touches neither.

website:
  title: "ICRC2023 Diversity Survey Results"
  description: >-
    Results of the pre- and post-conference diversity surveys for the
    International Cosmic Ray Conference 2023.
  site-url: "https://icrc2023.github.io/surveys/reports/"
  repo-url: "https://github.com/ICRC2023/surveys"
  repo-subdir: reports
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: "Pre-Survey"
        file: pre-survey/index.qmd
      - text: "Post-Survey"
        file: post-survey/index.qmd
    right:
      - icon: github
        href: "https://github.com/ICRC2023/surveys"
  sidebar:
    - id: pre-survey
      title: "Pre-Conference Survey"
      contents:
        - pre-survey/index.qmd
        - pre-survey/overview.qmd
        - pre-survey/questionnaire.qmd
        - pre-survey/response-timeline.qmd
        - section: "Responses"
          contents:
            - pre-survey/responses/q01_age.qmd
            - pre-survey/responses/q02_gender_identity.qmd
            - pre-survey/responses/q03_workplace.qmd
            - pre-survey/responses/q04_hometown.qmd
            - pre-survey/responses/q05_job_title.qmd
            - pre-survey/responses/q06_research_domain.qmd
            - pre-survey/responses/q07_research_type.qmd
            - pre-survey/responses/q08_research_years.qmd
            - pre-survey/responses/q09_career_satisfaction.qmd
            - pre-survey/responses/q10_hours.qmd
            - pre-survey/responses/q11_signup.qmd
            - pre-survey/responses/q12_dei_group.qmd
            - pre-survey/responses/q13_female_ratio.qmd
            - pre-survey/responses/q14_female_ratio_thoughts.qmd
            - pre-survey/responses/q15_good_practice_examples.qmd
            - pre-survey/responses/q16_group_concerns.qmd
            - pre-survey/responses/q17_dei_individual.qmd
            - pre-survey/responses/q18_agree_disagree.qmd
            - pre-survey/responses/q19_science_interest.qmd
            - pre-survey/responses/q20_individual_concerns.qmd
            - pre-survey/responses/q21_dei_hindering.qmd
            - pre-survey/responses/q22_remarks.qmd
        - pre-survey/clusters.qmd
        - pre-survey/chi2.qmd
    - id: post-survey
      title: "Post-Conference Survey"
      contents:
        - post-survey/index.qmd
        - post-survey/questionnaire.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    fig-responsive: true
