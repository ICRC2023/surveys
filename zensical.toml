[project]
site_url = "https://www.icrc2023.org/surveys/titanite/"
site_name = "titanite"
site_description = "Pluggable survey processing framework for ICRC2023 diversity survey analysis"
site_author = "Shota Takahashi / ICRC2023 Diversity Group"

copyright = "Copyright &copy; 2023 Shota Takahashi"

repo_url = "https://github.com/ICRC2023/surveys"
repo_name = "ICRC2023/surveys"
edit_uri = "edit/main/docs/"

nav = [
  { "titanite" = "index.md" },
  { "User Guide" = [
    { "Overview" = "user/index.md" },
    { "Quick Start" = "user/quickstart.md" },
    { "Installation" = "user/installation.md" },
    { "CLI Commands" = "user/cli-commands.md" },
    { "Configuration" = "user/configuration.md" },
  ] },
  { "Developer Guide" = [
    { "Overview" = "developer/index.md" },
    { "Architecture" = "developer/architecture.md" },
    { "Plugin Development" = "developer/plugin-development.md" },
    { "Testing" = "developer/testing.md" },
    { "Contributing" = "developer/contributing.md" },
  ] },
  { "Statistics" = [
    { "Overview" = "statistics/index.md" },
    { "Chi-Square Test" = "statistics/chi2_test.md" },
    { "Clustering" = "statistics/clustering.md" },
    { "Binning" = "statistics/binning.md" },
    { "k-Anonymity" = "statistics/k_anonymity.md" },
  ] },
  { "API Reference" = "reference/index.md" },
  { "Releases" = [
    { "v0.8.0" = "releases/v0.8.0.md" },
    { "v0.7.0" = "releases/v0.7.0.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ICRC2023/surveys"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# API reference is generated from numpy-style docstrings by mkdocstrings.
# Declaring the plugin also enables its Markdown extension.
[project.plugins.mkdocstrings.handlers.python]
paths = [".."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
